services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitabs
      POSTGRES_USER: kitabs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kitabs -d kitabs]
      interval: 5s
      timeout: 3s
      retries: 15
  opensearch:
    image: opensearchproject/opensearch:3
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [search-data:/usr/share/opensearch/data]
  web:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://kitabs:${POSTGRES_PASSWORD}@postgres:5432/kitabs
    command: npm run start
    ports: [3000:3000]
    volumes: [./data:/app/data, ./imports:/app/imports]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://kitabs:${POSTGRES_PASSWORD}@postgres:5432/kitabs
    command: npm run worker
    volumes: [./data:/app/data, ./imports:/app/imports]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
  search-data:
